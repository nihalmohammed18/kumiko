name: Nightly WebKit

# The light project's play tests, axe and UX rules in WebKit (Safari's engine), without screenshots. It doesn't gate
# pull requests: it reports engine differences the Chromium projects can't see.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    # The same image as CI's browser jobs; it ships WebKit too.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project webkit
        env:
          KUMIKO_WEBKIT: "1"
