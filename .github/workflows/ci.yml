name: CI

on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Verify the next release without publishing
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # The PR title becomes the squashed commit message, which decides the next version.
      - name: Validate PR title
        shell: bash
        run: |
          # Read the live title, so re-running this job after fixing a title passes.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            title="$(gh pr view "$PR_NUMBER" --json title -q .title)"
          else
            title="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json title -q '.[0].title')"
            if [[ -z "$title" ]]; then
              echo "No open PR for $GITHUB_REF_NAME, so there is no title to check."
              exit 0
            fi
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+$'
          if [[ ! "$title" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits, for example: chore: add CI guardrails."
            exit 1
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm size
      - run: pnpm validate
      - run: pnpm build:storybook
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  browser:
    name: browser (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # The same image makes and checks screenshot baselines, so pixels match.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        mode: [light, dark, rtl, touch, forced, motion]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project ${{ matrix.mode }} ${{ matrix.mode == 'light' && '--coverage' || '' }}
        env:
          KUMIKO_VRT: "1"
      - name: Summarize coverage
        if: matrix.mode == 'light'
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";
          const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
          console.log("### Coverage (light)\n\n| Metric | Coverage |\n| --- | ---: |");
          for (const metric of ["statements", "branches", "functions", "lines"]) {
            console.log(`| ${metric} | ${total[metric].pct}% |`);
          }
          NODE
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.mode }}
          path: |
            **/__screenshots__/**/*.png
            .vitest/attachments
          # The failure diffs live in a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore

  consumer:
    name: consumer (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: next 15.5, webpack
            next: 15.5.29
            typescript: 5.8.3
          - name: next 16.4, turbopack
            next: 16.4.5
            typescript: 6.0.3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm pack
      - name: Build a Next app with the packed package
        working-directory: examples/next
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund ../../kumiko-ui-0.0.0-development.tgz next@${{ matrix.next }} typescript@${{ matrix.typescript }}
          npx next build
          node verify.mjs

  pages:
    name: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: release
    # Switched on after the 1.0 review: gh variable set RELEASE_ENABLED -b true
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && vars.RELEASE_ENABLED == 'true'
    needs: [check, browser, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # No registry-url here: it would make npm look for a token instead of using trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-dry-run:
    name: release-dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run
    needs: [check, browser, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # No registry-url here: it would make npm look for a token instead of using trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
